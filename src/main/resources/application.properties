spring.application.name=InfantMilkCare

# Port — Render injects PORT automatically; falls back to 8081 for local dev
server.port=${PORT:8081}

# ── Database (PostgreSQL) ────────────────────────────────────────────────────
# Override DB_URL / DB_USERNAME / DB_PASSWORD via environment variables in
# Render (or any other host).  Defaults point at a local PostgreSQL instance.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/infant_milk_care}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=true
